spring:
  datasource:
    # 테스트는 매번 깨끗한 인메모리 DB로 실행 (파일 DB를 건드리지 않음)
    url: jdbc:h2:mem:piggybank-test-${random.uuid};MODE=Oracle;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data-test.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  h2:
    console:
      enabled: false
